<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes AI Papers - Daily Research Digest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0a0a0f',
                        card: '#141419',
                        border: '#27272a',
                        primary: {
                            DEFAULT: '#6366f1',
                            hover: '#8b5cf6',
                        },
                        text: {
                            primary: '#e4e4e7',
                            secondary: '#a1a1aa',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0f; color: #e4e4e7; }
        .paper-card { transition: all 0.3s ease; }
        .paper-card:hover { border-color: rgba(99, 102, 241, 0.5); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1); transform: translateY(-2px); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="min-h-screen antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-background/80 backdrop-blur-md border-b border-border">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-4 mb-4">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-primary/10 rounded-lg">
                        <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-text-primary">Hermes AI Papers</h1>
                        <p class="text-sm text-text-secondary">每日精选 · 前沿研究速递</p>
                    </div>
                </div>
                
                <div class="hidden md:block w-96">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="搜索论文标题、摘要..." 
                            class="w-full pl-10 pr-4 py-3 bg-card border border-border rounded-lg text-text-primary placeholder-text-secondary focus:outline-none focus:border-primary transition-colors">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div class="flex items-center gap-3 bg-card border border-border rounded-lg p-2">
                    <button id="prevDate" class="p-2 hover:bg-border rounded-md transition-colors disabled:opacity-30" title="前一天">
                        <svg class="w-5 h-5 text-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div class="flex items-center gap-2 px-4 py-2">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span id="currentDate" class="font-mono font-medium text-text-primary">Loading...</span>
                    </div>
                    <button id="nextDate" class="p-2 hover:bg-border rounded-md transition-colors disabled:opacity-30" title="后一天">
                        <svg class="w-5 h-5 text-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="flex items-center gap-6 text-sm">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                        <span class="text-text-secondary">扫描 <strong id="totalScanned" class="text-text-primary">—</strong> 篇</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                        <span class="text-text-secondary">精选 <strong id="totalSelected" class="text-text-primary">—</strong> 篇</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 py-8">
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-20">
            <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-text-secondary">加载最新论文...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden text-center py-20">
            <div class="text-6xl mb-4">😕</div>
            <h2 class="text-2xl font-bold text-text-primary mb-2">无法加载数据</h2>
            <p id="errorMessage" class="text-text-secondary">请稍后重试</p>
        </div>

        <!-- Content Container -->
        <div id="contentContainer" class="hidden">
            <!-- Date Info Banner -->
            <div class="mb-8 p-6 bg-gradient-to-r from-primary/10 via-purple-500/10 to-pink-500/10 rounded-xl border border-primary/20">
                <div class="flex items-center gap-3 mb-2">
                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <h2 class="text-xl font-bold text-text-primary"><span id="bannerDate"></span> 论文日报</h2>
                </div>
                <p class="text-text-secondary">数据来源：<span id="dataSource"></span> · 覆盖领域：<span id="dataCategories"></span></p>
            </div>

            <!-- Papers Container -->
            <div id="papersContainer" class="space-y-8"></div>

            <!-- Footer -->
            <div class="mt-12 pt-8 border-t border-border text-center text-sm text-text-secondary">
                <p>本期报告由 Hermes AI Paper Cron 自动生成 · 共 <span id="footerCount"></span> 篇精选论文</p>
            </div>
        </div>
    </main>

    <script>
        // State
        let currentDate = '';
        let allDates = [];
        let currentData = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadAllDates();
            await loadLatestPapers();
            
            // Event listeners
            document.getElementById('prevDate').addEventListener('click', () => navigateDate('prev'));
            document.getElementById('nextDate').addEventListener('click', () => navigateDate('next'));
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        });

        async function loadAllDates() {
            try {
                const response = await fetch('/api/papers/all');
                const data = await response.json();
                allDates = data.dates || [];
            } catch (error) {
                console.error('Failed to load dates:', error);
            }
        }

        async function loadLatestPapers() {
            try {
                const response = await fetch('/api/papers/latest');
                if (!response.ok) throw new Error('Failed to load papers');
                const data = await response.json();
                renderPapers(data);
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadPapersByDate(date) {
            showLoading();
            try {
                const response = await fetch(`/api/papers/${date}`);
                if (!response.ok) throw new Error(`No data for ${date}`);
                const data = await response.json();
                renderPapers(data);
            } catch (error) {
                showError(error.message);
            }
        }

        function renderPapers(data) {
            currentData = data;
            currentDate = data.date;
            
            // Update UI
            document.getElementById('currentDate').textContent = data.date;
            document.getElementById('bannerDate').textContent = data.date;
            document.getElementById('dataSource').textContent = data.source;
            document.getElementById('dataCategories').textContent = data.categories.join(', ');
            document.getElementById('totalScanned').textContent = data.stats.totalScanned || '—';
            document.getElementById('totalSelected').textContent = data.stats.selected || data.papers.length;
            document.getElementById('footerCount').textContent = data.papers.length;
            
            // Group by category
            const papersByCategory = {};
            data.papers.forEach(paper => {
                const cat = paper.categoryLabel;
                if (!papersByCategory[cat]) papersByCategory[cat] = [];
                papersByCategory[cat].push(paper);
            });
            
            // Render categories
            const container = document.getElementById('papersContainer');
            container.innerHTML = '';
            
            Object.entries(papersByCategory).forEach(([category, papers]) => {
                const section = createCategorySection(category, papers);
                container.appendChild(section);
            });
            
            // Show content
            hideLoading();
            document.getElementById('contentContainer').classList.remove('hidden');
            document.getElementById('errorState').classList.add('hidden');
            
            // Update navigation buttons
            updateNavigationButtons();
        }

        function createCategorySection(title, papers) {
            const section = document.createElement('div');
            section.className = 'mb-8 fade-in';
            
            const header = document.createElement('button');
            header.className = 'flex items-center gap-3 w-full text-left mb-4 group';
            header.innerHTML = `
                <div class="p-2 rounded-lg bg-primary/10 group-hover:bg-primary/20 transition-colors">
                    <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-text-primary flex-1">${title}</h2>
                <span class="text-sm text-text-secondary bg-card px-3 py-1 rounded-full border border-border">${papers.length} 篇</span>
            `;
            
            const papersContainer = document.createElement('div');
            papersContainer.className = 'space-y-4 ml-2';
            
            papers.forEach((paper, index) => {
                const card = createPaperCard(paper, index);
                papersContainer.appendChild(card);
            });
            
            header.addEventListener('click', () => {
                papersContainer.classList.toggle('hidden');
                const icon = header.querySelector('svg');
                if (papersContainer.classList.contains('hidden')) {
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>';
                } else {
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>';
                }
            });
            
            section.appendChild(header);
            section.appendChild(papersContainer);
            
            return section;
        }

        function createPaperCard(paper, index) {
            const card = document.createElement('div');
            card.className = 'bg-card border border-border rounded-xl p-6 paper-card fade-in';
            card.style.animationDelay = `${index * 50}ms`;
            
            const innovationsHtml = paper.innovations.map(inn => 
                `<li class="text-text-secondary text-sm leading-relaxed flex items-start gap-2">
                    <span class="text-primary mt-1.5">•</span>
                    <span>${inn}</span>
                </li>`
            ).join('');
            
            card.innerHTML = `
                <div class="flex items-start justify-between gap-4 mb-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">${paper.categoryLabel}</span>
                            ${paper.id ? `<span class="text-xs text-text-secondary font-mono">${paper.id}</span>` : ''}
                        </div>
                        
                        <h3 class="text-xl font-bold text-text-primary leading-tight mb-2">
                            <a href="${paper.link}" target="_blank" rel="noopener noreferrer" 
                                class="hover:text-primary transition-colors inline-flex items-center gap-2">
                                ${paper.title}
                                <svg class="w-4 h-4 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </a>
                        </h3>
                        
                        <p class="text-text-secondary leading-relaxed">${paper.summary}</p>
                    </div>
                </div>

                <button class="expand-btn flex items-center gap-2 text-sm text-primary hover:text-primary-hover transition-colors font-medium mt-2">
                    <svg class="w-4 h-4 chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                    <span class="btn-text">展开详情</span>
                </button>

                <div class="details-content hidden mt-6 space-y-5 border-t border-border pt-5">
                    ${paper.innovations.length > 0 ? `
                        <div>
                            <div class="flex items-center gap-2 mb-3">
                                <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                                </svg>
                                <h4 class="font-semibold text-text-primary">核心创新</h4>
                            </div>
                            <ul class="space-y-2 ml-7">${innovationsHtml}</ul>
                        </div>
                    ` : ''}
                    
                    ${paper.method ? `
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                                </svg>
                                <h4 class="font-semibold text-text-primary">方法</h4>
                            </div>
                            <p class="text-text-secondary text-sm leading-relaxed ml-7">${paper.method}</p>
                        </div>
                    ` : ''}
                    
                    ${paper.results ? `
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                                </svg>
                                <h4 class="font-semibold text-text-primary">结果</h4>
                            </div>
                            <p class="text-text-secondary text-sm leading-relaxed ml-7">${paper.results}</p>
                        </div>
                    ` : ''}
                    
                    ${paper.importance ? `
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                                </svg>
                                <h4 class="font-semibold text-text-primary">为什么重要</h4>
                            </div>
                            <p class="text-text-secondary text-sm leading-relaxed ml-7">${paper.importance}</p>
                        </div>
                    ` : ''}
                </div>
            `;
            
            // Add expand/collapse functionality
            const expandBtn = card.querySelector('.expand-btn');
            const detailsContent = card.querySelector('.details-content');
            const btnText = card.querySelector('.btn-text');
            const chevronIcon = card.querySelector('.chevron-icon');
            
            expandBtn.addEventListener('click', () => {
                const isHidden = detailsContent.classList.contains('hidden');
                detailsContent.classList.toggle('hidden');
                
                if (isHidden) {
                    btnText.textContent = '收起详情';
                    chevronIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>';
                } else {
                    btnText.textContent = '展开详情';
                    chevronIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>';
                }
            });
            
            return card;
        }

        function navigateDate(direction) {
            const currentIndex = allDates.indexOf(currentDate);
            if (currentIndex === -1) return;
            
            const newIndex = direction === 'prev' ? currentIndex + 1 : currentIndex - 1;
            if (newIndex >= 0 && newIndex < allDates.length) {
                loadPapersByDate(allDates[newIndex]);
            }
        }

        function updateNavigationButtons() {
            const currentIndex = allDates.indexOf(currentDate);
            document.getElementById('prevDate').disabled = currentIndex >= allDates.length - 1;
            document.getElementById('nextDate').disabled = currentIndex <= 0;
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            if (query.length < 2) {
                // Show all papers
                if (currentData) renderPapers(currentData);
                return;
            }
            
            // Filter papers
            const filtered = currentData.papers.filter(paper => {
                const searchText = [
                    paper.title,
                    paper.summary,
                    paper.method,
                    paper.results,
                    ...paper.innovations
                ].join(' ').toLowerCase();
                
                return searchText.includes(query);
            });
            
            // Re-render with filtered results
            const filteredData = { ...currentData, papers: filtered };
            renderPapers(filteredData);
        }

        function showLoading() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('contentContainer').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('hidden');
        }

        function showError(message) {
            hideLoading();
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('contentContainer').classList.add('hidden');
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>

<script>
// Embedded paper data - generated on 2026-08-21T21:30:10.319Z

检测（Meta-Detection）引入 AI 生成视频取证，通过可验证的时间 grounding 和证据引导的奖励重分配强化学习，实现鲁棒的伪造视频检测。","innovations":["元检测范式同时优化预测标签和支持证据，而非仅靠标签级监督","可验证时间 grounding用边界帧条件视频生成模型替换时间片段来构建配对的真/假视频，操纵区间可精确控制，比文本 rationale 更客观","证据引导奖励重分配根据证据质量在标签正确的响应间重新分配奖励，保留可靠标签监督的同时鼓励细粒度伪造定位"],"method":"构建自动化数据管道生成配对真/假视频，使用强化学习训练检测器，引入 Evidence-Guided Reward Redistribution 进行证据感知的信用分配。","results":"实验证明 VidForensics-M1 能有效利用可验证时间证据实现**鲁棒且可泛化的** AI 生成视频检测。","importance":"视频生成模型（Sora、Kling 等）越来越逼真，传统的监督微调方法泛化差，该方法为应对不断演进的生成攻击提供了新思路。"},{"id":"2608.11191","title":"Test-Time Self-Evolving GUI Visual Grounding via Reflection-Guided On-Policy Self-Distillation","link":"https://arxiv.org/abs/2608.11191","category":"计算机视觉","categoryLabel":"🖼️ 计算机视觉 / Computer Vision","summary":"提出测试时自进化框架，使 GUI 视觉定位模型在部署后无需人工标注即可自我改进，平均准确率提升 7.4%。","innovations":["测试时自进化闭环构建探索 → 评估 → 反思 → 内化的四阶段闭环，模型在部署后持续学习","MLLM 驱动的反思器用多模态大语言模型评估探索结果并提供推理反思","反思引导的在线自蒸馏将高层推理转化为密集 token 级监督，首次成功用于 GUI 视觉定位的测试时适配","对比校准防止失败的探索中的错误自回归前缀污染监督信号"],"method":"智能体在未见过界面上预测定位坐标，MLLM 反思器评估并生成反思，通过条件自教师将反思知识蒸馏到模型权重中。","results":"在 **6 个基准**上平均准确率提升 **7.4%**，无需任何人工标注 ground truth。","importance":"GUI Agent 是 LLM Agent 的重要应用方向，测试时自适应能力是实际部署的关键瓶颈，该方法首次展示了在线自蒸馏在 GUI 定位上的可行性。"},{"id":"2608.08557","title":"OpenVisTool: An Open Recipe for Synthesizing Instructive Visual Tool-Use Trajectories","link":"https://arxiv.org/abs/2608.08557","category":"计算机视觉","categoryLabel":"🖼️ 计算机视觉 / Computer Vision","summary":"提出 OpenVisTool 框架，通过因果效用筛选而非结果正确性筛选来构建视觉工具使用训练数据，显著提升多模态 Agent 的工具学习能力。","innovations":["因果效用筛选指出现有方法假设\"答案正确=有效监督\"是错误的，强的教师往往不需要工具就能答对，导致学生学到\"工具伴随正确答案\"而非\"工具观测支撑答案\"","双条件筛选轨迹必须满足结果有效（答案正确）且因果有用（工具观测对答案有因果贡献）","三阶段管道难度筛选 → 领域特定轨迹合成 → 监督验证"],"method":"构建 OpenVisTool-42K 数据集（跨 5 个视觉推理领域）和 OpenVisTool-Bench 基准。","results":"在 4 个 backbone（4B-27B）上微调，**一致性地** 提升视觉工具使用性能，并在 **2 个分布外基准**上获得增益。","importance":"揭示了工具使用训练数据质量的关键问题——不是所有正确轨迹都是有用的教学材料，为多模态 Agent 的训练提供了新的方法论。"},{"id":"2604.26355","title":"Shorthand for Thought: Compressing LLM Reasoning via Entropy-Guided Supertokens","link":"https://arxiv.org/abs/2604.26355","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"发现推理 trace 中的 token 可分为低熵的\"结构性 token\"和高熵的\"有机性 token\"，通过 BPE 合并结构性 token 为\"超 token\"，在平均压缩 8.1% 推理长度的同时保持准确率不变。","innovations":["结构性 vs 有机性 token 的二分法结构性 token 是重复出现的公式化短语（回溯提示、验证步骤等），有机性 token 是特定问题的内容","超 token（Supertokens）通过对模型自身推理 trace 进行跨词 BPE 合并，捕获频繁结构模式","可解释的推理标注超 token 充当推理动作的标注（回溯、验证、策略切换），一目了然地暴露模型的高层策略","正确 vs 错误 trace 的结构性差异分析结构性 token 间的转换发现正确和错误推理 trace 存在系统性差异"],"method":"在模型自身推理 trace 上训练 BPE 合并生成超 token，再通过监督微调教模型使用这些超 token。","results":"跨 **3 个模型族**和 **5 个数学推理基准**，推理 trace 平均缩短 **8.1%**，**没有任何模型-基准组合出现统计显著的准确率下降**。","importance":"推理压缩是 LLM 推理成本的关键瓶颈，该方法模型无关且无需修改模型架构，同时提供了推理过程的可解释性。"},{"id":"2608.11138","title":"Attention-Path Fragility as an Uncertainty Signal in Large Language Models","link":"https://arxiv.org/abs/2608.11138","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"提出\"注意力路径脆弱性\"作为 LLM 不确定性信号，通过掩码注意力头并测量子网络间的 BALD 互信息，实现无需训练的不确定性估计。","innovations":["注意力脆弱性作为不确定性不仅看输出分布的宽度，还看自信预测在注意力路径扰动下是否脆弱","ASMI（Attention-Subnetwork Mutual Information）掩码注意力头，测量子网络间的 BALD 互信息，用语义一致性核降低表面形式不一致的噪音","自预测适用范围信号强度与答案来源有关——在基于上下文的问答中强，在参数知识回忆中弱，模型能预测自己的适用范围"],"method":"训练-free 的估计器，对注意力头进行掩码采样，计算不同子网络输出间的互信息作为不确定性度量。","results":"在 grounded QA 测试中，ASMI **在置信度过滤之上额外提供了错误预测信息**，集中于\"自信但脆弱\"的预测，作用于其上可将保留错误**减半**。在 12 个 grounded 基准中，Sem-ASMI（仅用单次贪婪解码）在 **10/12** 中持平或超越 Semantic Entropy。","importance":"不确定性估计对 LLM 可靠性评估至关重要，ASMI 是一个零成本（无需多次采样）且信息量超过传统方法的估计器。"},{"id":"2604.20209","title":"Scaling Self-Play with Self-Guidance","link":"https://arxiv.org/abs/2604.20209","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"提出自引导自博弈（SGS），通过让语言模型自身担任\"引导者\"角色防止 Conjecturer 模型崩溃，解决了 LLM 自博弈的扩展瓶颈问题。","innovations":["诊断 Conjecturer 崩溃发现现有自博弈方法在长训练后会遇到学习平台期，原因是 Conjecturer 学会\"hack 奖励\"，生成人工复杂但无帮助的问题","三角色自博弈模型同时扮演 Solver（解题者）、Conjecturer（出题者）和 Guide（引导者）","Guide 评分机制评估合成问题与未解决目标问题的相关性和自然性，防止 Conjecturer 退化为奖励黑客"],"method":"扩展训练时间远超过往工作，对累积解决率曲线拟合缩放定律，在形式化定理证明和数学领域评估。","results":"SGS 在长时间训练中展现出**优于先前方法的扩展性**，通过引导机制成功防止了 Conjecturer 崩溃。","importance":"自博弈被认为是实现 LLM 无限学习潜力的关键路径，SGS 解决了长期训练中的核心瓶颈——出题模型退化。"},{"id":"2608.11204","title":"Surgical WAM: A World-Action Model for Data-Efficient Surgical Robot Learning","link":"https://arxiv.org/abs/2608.11204","category":"机器人学习","categoryLabel":"🤖 机器人学习 / Robot Learning","summary":"提出手术世界-动作模型（Surgical WAM），通过无动作标签的手术视频预训练学习视觉动态先验，在固定动作标注预算下将手术操控成功率从 63.5% 提升到 77.8%。","innovations":["视频预训练的迁移价值首次系统验证无动作标签的手术视频能否改善闭环手术操控——答案是肯定的","基于 Cosmos Policy 的联合预测同时预测未来内窥镜观测和执行动作块","两段式训练先在无动作视频上学习手术视觉动态，再用固定预算的动作标注微调","滚动时域控制器部署时执行预测动作块的前缀，然后从新观测重新规划"],"method":"视频预训练 → 动作标注微调 → 闭环 receding-horizon 控制，构建在 Cosmos Policy 生成模型架构上。","results":"在 **4 个模拟手术操控任务**上，视频预训练将平均成功率从 **63.5% 提升至 77.8%**，其中 PegTransfer 任务**绝对提升 20 个百分点**，在接触密集和双手任务上提升最大。","importance":"手术机器人数据标注极其昂贵，该方法证明了利用大量无标注视频数据可以显著提升数据效率，为手术机器人学习的规模化提供了实用路径。"},{"id":"2608.11152","title":"Scheduling Mixed RL Rollouts Beyond Prefix Locality","link":"https://arxiv.org/abs/2608.11152","category":"系统","categoryLabel":"🏗️ 系统 / 基础设施 / Infrastructure","summary":"提出 MISA-T，一个针对混合 RL rollout 服务的路由层准入策略，解决 RLVR、RLHF 和 Agent rollout 共享推理服务时的 KV cache 竞争问题。","innovations":["识别异构 rollout 的 KV 竞争RLVR、RLHF 和 agentic rollout 具有不同的序列结构、交互模式和 KV 驻留时间，现有前缀感知路由无法控制这种竞争","三合一策略自适应会话准入 + 工作负载感知 KV 容量分配 + 驻留时间感知 KV 记账","保持训练器指定的工作负载混合调度器不能扭曲训练器指定的 rollout 混合比例"],"method":"在推理服务的路由层实现 MISA-T 准入策略，结合自适应 admission、KV 容量分配和驻留时间感知的 KV 会计。","results":"在 Step3.7 和 Qwen3.6-35B-A3B 上，rollout 吞吐量分别比 sweep-tuned cache-aware vLLM Router **提升 53.3% 和 43.6%**；在 50 轮 Step3.7 实验中，吞吐量提升 **35.6%**，平均迭代时间**减少 22.8%**。","importance":"随着 LLM 的 RL 后训练越来越普遍，混合 rollout 调度的效率直接影响训练成本和速度，MISA-T 提供了实质性的工程改进。"},{"id":"2608.07440","title":"Blast Radius: Predictive Memory Management for Agentic Coding","link":"https://arxiv.org/abs/2608.07440","category":"系统","categoryLabel":"🏗️ 系统 / 基础设施 / Infrastructure","summary":"提出 Blast Radius，一个预测性内存管理层，通过估算 prompt 的影响范围来减少 Agentic Coding 中的 token 浪费，在 7 个 OpenAI 模型上减少 17-26% 的 token 消耗。","innovations":["预测性上下文管理NECROPHORESIS 实现可逆驱逐——将\"死上下文\"逐字存档","重复死事务（RDM）识别并掩埋反复出现的转录内容","数学基础在 Polish 上下文空间上形式化可逆上下文驱逐，将上下文熵与复活概率联系起来"],"method":"在 agentic coding 系统的底层添加 Blast Radius 内存管理层，决定哪些记录应该\"掩埋\"以及传入 prompt 能影响代码库多深。","results":"跨 **7 个 OpenAI 模型**，token 消耗减少 **17-26%**，测试策略中**溢出率最低**，且保持**字节精确可逆**。450 个被掩埋的 body 中 378 个是重复死事务，**零个**被召回。","importance":"Agentic Coding（如 Devin、Cursor）的 token 成本是主要瓶颈，Blast Radius 从内存管理的角度提供了有效的成本控制方案。"},{"id":"2608.11167","title":"MultiModal Code-Switching: Interleaving Visual Objects into Language for Explicit Object-Level Alignment","link":"https://arxiv.org/abs/2608.11167","category":"多模态","categoryLabel":"🔬 多模态 / Multimodal","summary":"受语言中 code-switching 启发，提出将视觉对象嵌入文本序列的多模态预训练范式，用 50K 样本匹配 600K 图像-文本对模型的性能。","innovations":["对象级对齐 vs 图像级对齐现有 MLLM 用全局图像表征映射到文本描述，存在引用歧义——模型难以从全局表征推断多个视觉对象与文本实体的对应关系","多模态 code-switching用对应的视觉对象替换文本实体，强制局部视觉-语言对齐","高效数据合成管道自动生成 773K 样本，带有精确的对象-实体对应关系"],"method":"在预训练数据中将文本实体替换为对应的视觉对象 embedding，训练模型学习对象级别的跨模态对齐。","results":"**50K 样本**即可匹配或超越在 **600K 图像-文本对**上训练的模型，数据效率提升 **12 倍以上**。在多个模型规模上一致性改善视觉定位和感知能力。","importance":"揭示了当前 MLLM 预训练中图像级对齐的根本缺陷，提供了更细粒度、更高效的多模态对齐方案。"}],"stats":{"totalScanned":60,"selected":12}},"2026-08-10":{"date":"2026-08-10","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV"],"papers":[{"id":"2608.07261","title":"Why Knowing Both Hops Is Not Enough: Understanding Two-Hop Generalization in Language Models","link":"https://arxiv.org/abs/2608.07261","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"通过机制分析揭示 LLM 在多跳推理中的失败模式，提出循环式训练策略显著提升 OOD 泛化。","innovations":["机制性解释发现下层层级能正确构建实体中间表示，但上层层级主要学习映射而非推理，导致二跳 OOD 失败","循环式训练策略让 Transformer 跨输入形式复用推理电路，从根本上提升泛化能力","系统性实验设计在可控符号环境中从头训练 Transformer，分离各因素对泛化的影响"],"method":"在可控符号环境中训练 Transformer → 机制分析识别层级间失配 → 设计循环式训练策略让模型复用推理电路","results":"在 OOD 二跳查询上显著提升泛化性能；揭示了\"一致中间表示\"的成功泛化机制","importance":"首次给出 LLM 多跳推理失败的完整机制解释，为改进推理架构提供理论指导"},{"id":"2608.07430","title":"Diffusion LLMs as Targets and Adversaries: Mechanistic Safety Exploits","link":"https://arxiv.org/abs/2608.07430","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"揭示扩散 LLM 的安全对齐存在稀疏性漏洞，提出 SN-Guided Diffusion 离线黑盒越狱方法。","innovations":["安全神经元稀疏性与可迁移性DLLM 从自回归前体继承相同的机制安全足迹，安全对齐在架构间可迁移","自剪枝攻击通过剪枝将攻击成功率从 2.6% 提升至 73.8%（LLaDA）和从 1.9% 提升至 86.6%（Dream）","SN-Guided Diffusion完全离线黑盒越狱框架，利用加权安全神经元损失引导扩散过程远离安全触发区域"],"method":"分析 DLLM 安全神经元分布 → 剪枝增强攻击 → 设计 SN-Guided Diffusion 框架引导扩散去安全化","results":"对 Llama-3-8B-Instruct 转移攻击成功率 77.1%，Qwen2.5-7B-Instruct 86.9%，Gemini-2.5-Flash-Lite 74.3%；AUROC = 1.0 完美判别；每提示仅需 20 次生成","importance":"揭示扩散 LLM 安全机制的根本脆弱性，为新型对齐方法敲响警钟"},{"id":"2608.07460","title":"CreativeInstruct: Scalably Teaching LLMs to Balance Quality, Creativity, and Diversity","link":"https://arxiv.org/abs/2608.07460","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"提出 CreativeInstruct 指令微调方法，让 LLM 在保持质量的同时恢复创造性和多样性。","innovations":["创造性跨度注入学习在生成中插入特殊 [StartCreativity] 标记，在质量与创造性之间动态平衡","图编辑距离多样性度量提出基于图编辑距离的结构多样性指标，捕捉纯词汇/语义指标遗漏的叙事级变异","创造性作为 RL 底座的洞察创造性模型作为强化学习基座能显著提升数学推理性能"],"method":"设计包含创造性标记的指令微调数据集 → 训练模型学习质量-创造性平衡 → 在 RL 中验证创造性基座优势","results":"人类评估中 70.3% 认为 CreativeInstruct 更富创造性；GRPO 在此基础上在 AMC 提升约 4%，MATH 提升约 5 个百分点","importance":"解决了\"后训练降低创造性\"这一长期被忽视的问题，为创意任务和质量任务的统一提供方案"},{"id":"2608.07437","title":"Fisher-R1: Training LLM Agents for Reliable Hypothesis Testing","link":"https://arxiv.org/abs/2608.07437","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"通过 RL 训练 LLM Agent 进行可靠的统计假设检验，在 P-Bench 上超越 GPT-5.4 和 DeepSeek-V4-Pro。","innovations":["P-Bench 基准425 个开放 ended 假设检验任务，覆盖经济学、生物学和医学，评估真实统计推理能力","Fisher-R1 训练框架使用合成任务和 RL 训练，以经过验证的统计奖励驱动改进","揭示系统性推理缺陷当前 LLM Agent 频繁做出细微推断错误，导致错误结论"],"method":"构建 P-Bench → 生成合成统计任务 → RL 训练 LLM Agent → 在真实基准上评估","results":"Fisher-R1-14B 比 DeepSeek-V4-Pro 平均相对提升 21%，最难任务上提升达 26%；超越 GPT-5.4 和 DeepSeek-V4-Pro","importance":"首次系统性展示 LLM 在统计推理中的不可靠性，RL 可显著改善这一关键科学能力"},{"id":"2608.07449","title":"SkillProx: Self-Evolving Agent Skills via Proximal Textual Gradient Descent","link":"https://arxiv.org/abs/2608.07449","category":"大语言模型","categoryLabel":"🧠 大语言模型 / LLM","summary":"提出近端梯度启发的框架，让 LLM Agent 的自我进化技能具备闭环诊断和效用感知精炼。","innovations":["前向-后向框架前向阶段执行诊断驱动编辑并回滚退化，后向阶段基于留一效用审计进行分解和精炼","显式诊断-结果反馈将编辑结果反馈到后续诊断，形成闭环进化","效用感知近端精炼分解技能为可审计知识单元，应用验证门控的整合、降级或移除"],"method":"设计复合目标平衡任务损失和技能复杂度 → 前向诊断编辑 → 后向效用审计 → 闭环迭代","results":"跨多个基准和骨干模型平均准确率高出最强梯度基线 3.0 个百分点；组件消融验证诊断和精炼的互补效应","importance":"解决了现有技能进化框架缺乏显式诊断和有效整合的核心缺陷"},{"id":"2608.07418","title":"ResidencyRL: Reinforcement Learning in Simulated Clinical Environments","link":"https://arxiv.org/abs/2608.07418","category":"agent","categoryLabel":"🤖 Agent / 强化学习 / 机器人","summary":"模拟住院医师培训流程，通过多轮 RL 训练临床 AI Agent，显著提升诊断准确性和安全性。","innovations":["模拟住院医师培训将医学教育中的住院医师模式迁移到 RL，包含数千次遭遇、多样反馈和逐步自主性","长程多轮交互支持高达 60 轮对话和 8 次工具调用的复杂临床遭遇","结构化多轴奖励诊断准确性、管理质量、沟通、文档和安全的综合奖励体系"],"method":"LLM 模拟器生成对抗性临床场景 → 策略 Agent 通过 RL 优化 → 结构化奖励驱动训练 → 多基准迁移评估","results":"对抗条件下诊断准确率提升 7.0%（88.0% vs 81.0%），遗漏红旗率降低 31%；专家偏好率 87.6%；在 AMIE 六轴临床基准全面超越基线","importance":"证明序列临床决策可通过模拟 RL 有效学习，为 AI 临床精通开辟路径"},{"id":"2608.07267","title":"WNM-3D: A World Navigation Model with 3D Scene Conditioning for Closed-Loop VLN","link":"https://arxiv.org/abs/2608.07267","category":"agent","categoryLabel":"🤖 Agent / 强化学习 / 机器人","summary":"提出 3D 场景条件化的世界导航模型，在闭环视觉语言导航中超越行动中心方法。","innovations":["3D 几何感知场景编码冻结前馈几何编码器从单目 RGB 历史中提取几何感知表示","3D 场景到 Token 适配器将几何前缀注入世界-动作 Diffusion Transformer，通过块因果注意力条件化","混合训练策略A* 演示 + DAgger 自适应 + DanceGRPO 闭环优化三阶段训练"],"method":"几何编码器提取 3D 上下文 → 3D Scene-to-Token 适配器转换为固定长度前缀 → 条件化未来视景和动作生成 → 混合训练","results":"在 GN-Bench 上超越强 VLM 导航策略和 2D 条件基线；近目标评估集上更高流-动作一致性和更低视觉-运动误差","importance":"首次将 3D 几何条件化引入连续 VLN 的世界-动作模型，弥合语义能力与空间推理之间的鸿沟"},{"id":"2608.07463","title":"MirrorWorld: Taming Video Diffusion Models for Mirror Reflection Generation","link":"https://arxiv.org/abs/2608.07463","category":"计算机视觉","categoryLabel":"🔬 计算机视觉 / 多模态","summary":"提出镜面感知的视频修复框架，解决视频扩散模型生成镜面反射时的不一致问题。","innovations":["语义关系蒸馏 (SRD)从冻结视觉基础模型转移关系信息，建模\"反射什么\"","几何变换对齐 (GTA)学习变换引导反射内容的空间排列，建模\"如何排列\"","双互补机制设计SRD 和 GTA 互补，分别解决内容一致性和空间一致性"],"method":"冻结 VLM 提取语义关系 → SRD 蒸馏关系信息 → GTA 学习几何变换 → 视频修复框架统一生成","results":"在视频镜面反射生成基准上超越代表性图像反射生成方法和强视频修复基线","importance":"首次系统性解决视频扩散模型中的镜面反射一致性问题，构建统一基准推动该方向研究"},{"id":"2608.07088","title":"RoRA: Role-Oriented Regional Allocation for Visual Token Pruning in MLLMs","link":"https://arxiv.org/abs/2608.07088","category":"计算机视觉","categoryLabel":"🔬 计算机视觉 / 多模态","summary":"提出面向角色的区域分配框架，在视觉 token 剪枝中实现极致压缩下的精度保持。","innovations":["角色导向分配将 token 分为保护性语义核心、补充性上下文和细粒度细节，替代互换性假设","注意力锚定区域 (AAR)从高置信度锚点构建轻量级覆盖代理，避免重复覆盖同一对象","位置先验 + 提示校准对象先验双重校准文本条件注意力，提升选择精度"],"method":"注意力校准 → AAR 构建 → 角色导向 token 分区 → 分层选择策略 → 无需训练","results":"88.9% 剪枝率下保留 96.5% 完整性能；66.7% 剪枝率下仅需 0.7ms 选择时间，端到端加速 1.33x（NVIDIA H800）；在 Qwen3-VL 上比 D2Pruner 提升约 5%","importance":"解决了现有剪枝方法忽视对象覆盖跟踪的根本问题，实现极致压缩下的精度保持"},{"id":"2608.07302","title":"Same Attention, Different Truths: Put Logit-Lens over Visual Attention to Detect and Mitigate LVLM Object Hallucination","link":"https://arxiv.org/abs/2608.07302","category":"计算机视觉","categoryLabel":"🔬 计算机视觉 / 多模态","summary":"揭示 LVLM 幻觉的根因不是\"注意力不足\"而是\"注意力解码不一致\"，提出无需训练的检测-缓解框架。","innovations":["注意力一致性发现真实物体和幻觉物体在中后期层级获得同等强度的视觉注意力","Logit Lens 解码诊断真实物体区域可正确解码为目标 token，幻觉物体区域则不能","双幻觉机制识别视觉不确定性（语义混淆区域触发）和上下文先验（共现先验驱动）"],"method":"Logit Lens 解码高注意力区域 → 识别幻觉类型 → HARM（高注意力区域掩码）处理视觉不确定性 → VEED（视觉证据增强解码）处理上下文先验","results":"在多个幻觉基准上达到 SOTA；HARM 消除视觉不确定性幻觉，VEED 缓解上下文先验幻觉","importance":"颠覆了\"幻觉源于注意力不足\"的传统假设，为理解和缓解幻觉提供全新机制视角"},{"id":"2608.07291","title":"Foundation Models Adaptation for Multi-View Multi-modal Cardiac MRI Segmentation and Direct Ejection Fraction Estimation","link":"https://arxiv.org/abs/2608.07291","category":"医学影像","categoryLabel":"🏥 医学影像 / 基础模型应用","summary":"评估心脏 MRI 基础模型在多视图多序列分割和直接射血分数估计中的适配效果。","innovations":["CineMA 微调跨视图分割在短轴、两腔和四腔视图中微调 cine 和 LGE 分割","注意力多实例学习 LVEF 估计结合冻结基础模型嵌入 + 注意力 MIL 实现直接 LVEF 回归","系统性基准比较在 CMR-Multi Challenge 上评估多种基础模型的跨视图有效性"],"method":"CineMA 微调 → 多视图 cine/LGE 分割 → 冻结基础模型提取嵌入 → 注意力 MIL 回归 LVEF","results":"Cine 分割 Dice: 短轴 0.862、两腔 0.883、四腔 0.902；LGE 分割 Dice 0.621-0.846；LVEF 回归 MAE 4.96 百分点，Pearson 0.91","importance":"验证基础模型在多视图 CMR 分析中的有效适配性，同时指出 LGE 疤痕分割仍是挑战"},{"id":"2608.07176","title":"REVEAL: Representation-driven Endoscopic Visual Embedding Alignment for Latent Generation","link":"https://arxiv.org/abs/2608.07176","category":"医学影像","categoryLabel":"🏥 医学影像 / 基础模型应用","summary":"在 500 万胃镜帧上训练最大胃镜生成基础模型，实现领域特定表示对齐。","innovations":["领域内预训练编码器直接在胃镜分布上预训练编码器，替代跨域先验","大规模训练GastroNet-5M (GN-5M) 多中心 500 万帧数据集","双重能力既是高质量生成模型，也是竞争性特征提取器"],"method":"领域内预训练编码器 → 对齐扩散潜空间 → 在 5M 帧上训练 → 评估生成和特征提取能力","results":"在多个基准上与 EndoViT 和 Endo-FM 竞争甚至超越；在潜在空间编辑（修复、外延）中保持结构一致性","importance":"降低构建专业临床工具的门槛，为智能胃肠病学系统提供开放的通用基础"},{"id":"2608.07193","title":"AutoPrune: An AI4AI Framework for Visual Token Pruning","link":"https://arxiv.org/abs/2608.07193","category":"效率","categoryLabel":"⚡ 效率 / 推理优化","summary":"用 LLM 自动设计视觉 token 剪枝策略，在 14 个基准上实现 94.4% token 削减下的 99% 精度保持。","innovations":["TPDSL 领域专用语言131 个可复用原子，涵盖预算控制、token 评分、选择约束和重组","残差搜索空间每个搜索状态表示为强基线策略的残差修改，缩小搜索空间","AI4AI 范式LLM 自动导航设计空间，替代手工启发式和专家试错"],"method":"定义 TPDSL → LLM 驱动搜索策略设计 → 残差修改强基线 → 跨基准验证","results":"14 个多模态基准、3 个 MLLM 骨干；94.4% token 削减下保留 >99% 性能，FLOPs 降低 9.9x，预填延迟降低 6.4x","importance":"首次将 AI4AI 范式引入视觉 token 剪枝，解决设计空间爆炸问题"}],"stats":{"totalScanned":97,"selected":13}},"2026-08-09":{"date":"2026-08-09","source":"arXiv","categories":["cs.CV","cs.CL","cs.LG","cs.AI","cs.MM"],"papers":[{"id":"2606.09772","title":"SemDINO: Foundation Prior-Guided Cross-Temporal Semantic Alignment Network for Remote Sensing Change Detection","link":"https://arxiv.org/abs/2606.09772","category":"🛰️_遥感","categoryLabel":"🛰️ 遥感 / 多光谱 / 计算机视觉","summary":"将冻结的 DINOv3 视觉基础模型先验注入 CNN 金字塔特征中，实现遥感语义变化检测（SCD）中的跨时间语义对齐。","innovations":["Gated Pyramid Fusion (PyFu)用 Separate Adaptation Block (SepAB) 自适应适配冻结的 DINOv3 特征，再通过 GatedFusion 注入 CNN 多尺度特征，兼顾局部空间细节与预训练语义先验，同时抑制域噪声","Multi-scale Temporal Bi-directional Transformer (M-TBTT)在金字塔各层执行双向时序交互，同时对 T1/T2 两个时间状态进行校准，统一支持\"未变化区域一致性\"和\"变化区域判别性\"","SCD 导向的精细化预测管线#FeaCE 增强真变化、抑制伪变化；ChangeFusion + 解耦多任务 CD-Head 从 Change Map、S1/S2 Head 和 Edge Map 合成最终预测，可即插即用地切换到二分类变化检测（BCD）"],"method":"冻结 DINOv3 提供高层语义先验 → PyFu 模块将其与 CNN 金字塔特征门控融合 → M-TBTT 执行跨时间、跨尺度的双向 Transformer 交互 → #FeaCE 精细化 → 多任务 CD-Head 输出","results":"在 HRSCD 和 SECOND 两个公开 SCD 基准上验证，SCD 性能优于现有方法；切换至 BCD 任务时（不改架构）同样取得竞争力结果，证明特征的多任务通用性","importance":"首次将大规模自监督预训练的视觉基础模型先验系统地引入遥感语义变化检测，解决了\"基础模型表示与任务特定空间特征不匹配\"的核心难题"},{"id":"2608.06205","title":"CFGPNet: Cross-Attention-Based Fused Gradient Programmed Network for RGB-T 多光谱目标检测","link":"https://arxiv.org/abs/2608.06205","category":"🛰️_遥感","categoryLabel":"🛰️ 遥感 / 多光谱 / 计算机视觉","summary":"面向可见光-红外多光谱目标检测，提出计算高效的跨模态交互与梯度编程融合框架。","innovations":["改进 GELAN + RepViT 重参数化用 RepViT 风格的可重参数化块增强特征表达，同时保持推理效率","Cross Computation Efficient Attention (CrossCEA)减少可见光与红外分支间的冗余信息传输，强化有效的跨模态交互","Attention Selection and Aggregation (ASA)生成紧凑且具有判别力的融合表示"],"method":"改进 GELAN 骨干提取可见光/红外特征 → CrossCEA 模块进行高效跨模态注意力交互 → ASA 模块选择并聚合最佳融合特征 → 梯度编程策略优化多尺度检测头","results":"在标准 RGB-T 检测数据集上优于现有 SOTA 方法，同时参数量和 FLOPs 显著低于重型注意力架构","importance":"多光谱检测在低光照、恶劣天气下至关重要，该方法以轻量设计实现高效跨模态融合"},{"id":"2508.11183","title":"Versatile Video Representation via Feed-Forward 2D Gaussian Splatting Tokenization (GVT)","link":"https://arxiv.org/abs/2508.11183","category":"🛰️_遥感","categoryLabel":"🛰️ 遥感 / 多光谱 / 计算机视觉","summary":"将 2D 高斯溅射引入视频标记化，通过内容自适应采样实现空间-时间双重高效视频表示。","innovations":["Spatio-Temporal Gaussian Embedding (STGE)以 feed-forward 方式将视频潜空间刚性特征投影为 2D 高斯溅射参数（位置、协方差、系数），信息密集区域分配更高渲染权重","Gaussian Set Partitioning (GSP)可学习策略将 2D 高斯分为静态/动态两组，静态组跨帧复用，大幅减少时间冗余","GVT 端到端框架集成 STGE + GSP，无需逐视频优化即可实现自适应标记化"],"method":"视频片段 → 提取潜空间刚性特征 → STGE 生成 2D 高斯参数 → GSP 分离静/动态高斯 → rasterization 生成自适应视频 tokens → VQ-VAE 量化","results":"在视频重建上超过 MAGVIT-v2 基线；动作识别任务中取得 SOTA；视频压缩性能与基线相当，验证了语义编码效率","importance":"突破了固定网格视频 tokenization 的空间/时间冗余瓶颈，为视频基础模型提供了更高效的底层表示范式"},{"id":"2608.06310","title":"RRC: Unlocking Generative Reward Models in LLM Reinforcement Learning via Ranking-Based Reward Construction","link":"https://arxiv.org/abs/2608.06310","category":"大语言模型","categoryLabel":"🧠 大语言模型 / 强化学习 / 对齐","summary":"通过基于排序的奖励构建，打通生成式奖励模型（GRM）在 LLM 强化学习中的潜力。","innovations":["发现核心矛盾生成式奖励模型擅长比较排序，但现有 RL 算法依赖标量评分，这种\"比较 vs 标量\"的不匹配是 GRM 在 RL 中失效的根本原因","Self-competitive Ranking对模型自身采样的多个响应进行内部排序，从相对偏好中推导奖励信号","Anchor-guided Ranking用少量参考响应作为锚点，实现可扩展的排序到奖励转换"],"method":"GRM 生成对采样响应的相对排序 → RRC 将排序转化为标量奖励 → 输入 PPO 等 RL 算法进行策略更新","results":"在开放对话和推理基准上，RRC + GRM 的 RL 训练显著优于直接使用判别式奖励模型的方法，证明 GRM 的排序能力可有效转化为 RL 信号","importance":"为\"生成式奖励模型如何在 RL 中发挥作用\"这个开放问题提供了直接、有效的解决方案，推动了奖励建模范式从判别式向生成式的迁移"},{"id":"2608.06370","title":"The Bitter Lesson of Tool Calling","link":"https://arxiv.org/abs/2608.06370","category":"大语言模型","categoryLabel":"🧠 大语言模型 / 强化学习 / 对齐","summary":"大规模实验证明：对代码能力模型而言，以 Python 代码形式调用工具（Programmatic Tool Calling）优于传统 JSON 格式。","innovations":["Programmatic Tool Calling (PTC)工具以类型化 Python stub 暴露，模型生成代码调用而非 JSON；执行和结果在同一 Agent turn 内完成","14 个模型的系统对比在 BFCL v4 基准上全面对比 PTC 与原生 JSON tool calling"],"method":"将工具 API 转换为 Python stub → 模型生成调用代码 → 代码执行引擎运行并返回结果 → 单轮完成","results":"14 个模型中 11 个 PTC ≥ JSON baseline；GPT-5.6 系列 PTC 比 JSON 提升 10.6%；并行 fan-out 场景下 13/14 模型 PTC ≥ baseline","importance":"呼应 Rich Sutton \"bitter lesson\" 的思想——让模型发挥其核心能力（写代码）而非强迫适应结构化格式，是提升 Agent 工具使用效率的直观而有效的方向"},{"id":"2608.06377","title":"Learning When to Trust via Selective Context Preference Optimization (SCOPE)","link":"https://arxiv.org/abs/2608.06377","category":"大语言模型","categoryLabel":"🧠 大语言模型 / 强化学习 / 对齐","summary":"训练 LLM 选择性信任外部上下文——既不盲目跟随误导性信息，也不一概排斥有用上下文。","innovations":["MIST 基准人工标注，每个推理项在四种条件下呈现（clean、misleading、correct-context、irrelevant-context），配对指标 SC2W 量化\"误导性信号翻转正确答案\"的频率","SCOPE 方法挖掘 clean-correct / misleading-wrong 失败对，在四种条件下均衡采样的偏好对上运行标准 DPO，而非仅对误导性项优化"],"method":"构建四条件匹配数据 → SCOPE 挖掘偏好对 → 均衡 DPO 训练 → 模型学会\"可信时信任，不可信时抵抗\"","results":"显著提升抗误导能力（SC2W 下降），同时保持对正确上下文的利用率，避免\"拒绝一切上下文\"的退化","importance":"RAG 和检索增强生成场景中\"幻觉上下文污染\"是核心痛点，SCOPE 为选择性信任提供了可操作的训练框架"},{"id":"2607.28609","title":"OSReward: Standardized Evaluation for Cross-Platform Computer-Use Reward Models","link":"https://arxiv.org/abs/2607.28609","category":"大语言模型","categoryLabel":"🧠 大语言模型 / 强化学习 / 对齐","summary":"首次系统评估 VLM 作为计算机使用 Agent 轨迹裁判的可靠性，并构建标准化基准 OSReward。","innovations":["OSReward 基准跨平台（桌面、移动端、Web）的高质量 CUA 轨迹数据集，经多阶段人工标注获得真实判决","OSReward-Hard聚焦真正困难案例的挑战集","发现即使最强 VLM 裁判与现有基准自有验证器的意见分歧率约 25%（桌面场景）"],"method":"构建跨平台 Agent 基础设施 → 收集多样化 Agent 轨迹 → 多阶段人工标注 → 评估各 VLM 裁判的可靠性 → 提出 OS-Shepherd 训练范式","results":"揭示了当前 VLM 裁判在 CUA 轨迹评估中的系统性偏差，为 Agent RL 中的奖励建模提供了可信评估基础","importance":"Computer-use Agent 是当前最活跃的方向之一，奖励模型/裁判的可靠性直接影响 RL 训练质量，此前该问题长期未被系统研究"},{"id":"2604.21395","title":"Supervised Learning Has a Geometric Blind Spot","link":"https://arxiv.org/abs/2604.21395","category":"基础理论","categoryLabel":"🔬 基础理论 / 多模态 / 方法学","summary":"证明了所有基于经验风险最小化（ERM）的监督学习都必然在标签相关干扰方向上保留非零敏感性——这是数学约束，非工程缺陷。","innovations":["ERM Encoder Non-Isometry 定理任何 ERM 最小化器在标签相关的干扰方向上必然保持严格正的路径长度畸变，与模型容量和数据量无关","一理通四非鲁棒特征、纹理偏好、噪声脆弱性、鲁棒-准确权衡统一为该结构机制的推论","Trajectory Deviation Index (TDI)新的机制诊断工具，揭示了 PGD/PMH 在几何各向同性上的差异（PGD: 低 Frobenius 范数 2.91 但 TDI 最差 1.336；PMH: TDI 最优 0.904）"],"method":"理论证明 ERM 的几何盲点 → 提出 Isotropic Encoder Matching (PMH)：在任务损失约束下惩罚高斯扰动下的特征位移 → 七个任务验证","results":"CIFAR-10 ViT 上 PMH 以最低 TDI 超越 PGD；在 BERT/SST-2 和 ImageNet ViT-B/16 上盲点可测量、可修复；PMH 在非高斯噪声（模糊/亮度/对比度）上也领先，无需特定噪声训练","importance":"从理论层面统一了鲁棒性领域的多个经验现象，并指出基础模型（CLIP/DINO/SAM 同属 ViT-B/16 家族）同样存在几何盲点"},{"id":"2608.05000","title":"Towards Physics of Multimodal Pretraining","link":"https://arxiv.org/abs/2608.05000","category":"基础理论","categoryLabel":"🔬 基础理论 / 多模态 / 方法学","summary":"通过系统性控制实验揭示多模态预训练的四个基本\"物理定律\"：知识流、模态协同、早期统一、实用配方。","innovations":["Knowledge Flow分离语言→视觉理解、视觉理解→语言生成、视觉生成→理解等跨模态知识迁移的不对称模式","Synergy vs Competition数据\"复杂度\"决定模态间是协同还是竞争；共享 attention + normalization + 模态特定 FFN 的架构促进协同","Early Unification发现早期统一预训练比后期拼接带来更好的跨模态泛化","Recipes总结可复现的多模态预训练实用指南"],"method":"在合成数据集和大规模真实数据集上进行受控实验，系统性比较不同架构和数据配比","results":"揭示了架构选择和数据复杂度对多模态协同的定量影响，结论在不同规模和架构上具有泛化性","importance":"为 natively unified 多模态预训练提供了第一份系统性\"物理学\"分析，指导未来多模态基础模型的设计"},{"id":"2606.14299","title":"What Drives Test-Time Adaptation for CLIP? A Controlled Empirical Study","link":"https://arxiv.org/abs/2606.14299","category":"基础理论","categoryLabel":"🔬 基础理论 / 多模态 / 方法学","summary":"对 CLIP 的测试时适应（TTA4CLIP）进行系统性控制实验，回答\"什么真正驱动了适应效果\"。","innovations":["三大范式统一将现有 TTA4CLIP 方法按\"测试时更新什么\"分为三类统一框架","TTABC 基准开源 TTA 基准，集成 20+ 代表性方法，标准化评估协议","三维度控制分析适应增益的来源、不同分布偏移下的可靠性、各范式的有效性边界"],"method":"构建统一评估框架 → 控制变量分析各 TTA 方法的核心组件贡献 → 跨数据集/偏移类型系统性比较","results":"揭示了 TTA4CLIP 的核心增益来源和在不同分布偏移下的可靠性边界，为方法选择提供了实证指南","importance":"TTA4CLIP 领域快速发展但缺乏理解基础，本研究为后续方法设计提供了清晰的实证基础"},{"id":"2608.06240","title":"PRISM: Distribution-Gated Flow Matching for Controllable Unpaired Image Translation","link":"https://arxiv.org/abs/2608.06240","category":"基础理论","categoryLabel":"🔬 基础理论 / 多模态 / 方法学","summary":"用每特征门控替代全局噪声/引导值，实现无配对图像翻译中的可控\"保留什么 vs 改变什么\"。","innovations":["Per-feature Gate每个源特征的标准化距离到目标特征分布决定门控值——远离目标的特征被释放（可改变），接近目标的特征被保留","门控控制两端初始化（混合真实源潜变量与任务匹配噪声）和 ODE 积分过程中的传输时机","GAN-free flow matching无需对抗训练，通过流匹配实现可控翻译"],"method":"计算源→目标分布距离 → 生成门控信号 → 门控控制初始化噪声混合比例 → 门控控制 ODE 传输 → 输出翻译结果","results":"在四个基准上取得最佳 Inception FID 和 KID；病理学数据集上核数量比率最接近理想值，证明在目标真实性和结构保留间的良好平衡","importance":"无配对图像翻译（如风格迁移、域适应）的核心难题是\"保内容换风格\"的粒度控制，PRISM 首次实现特征级别的自适应门控"},{"id":"2606.13460","title":"VISA: VLM-Guided Instance Semantic Auditing for 3D Occupancy World Models","link":"https://arxiv.org/abs/2606.13460","category":"基础理论","categoryLabel":"🔬 基础理论 / 多模态 / 方法学","summary":"用 VLM 在训练时对 3D 占用模型中的每个物体实例进行语义审计，提升自动驾驶世界模型的语义精度。","innovations":["发现将 3D 特征与 crop-caption 对齐可提升文本空间相似度，但不一定能提升封闭集占用 mIoU——两者不匹配","VISA 审计管线离线 VLM 对代表性 crop 进行审计（类别假设、可能混淆、可靠性、属性、证据）→ 沿目标轨迹传播 → 匹配到 3D 体素","蒸馏损失可靠性加权分类损失 + 属性因子损失 + 场景级审计图损失，推理阶段零开销"],"method":"训练时 VLM 审计每个实例 → 结构化审计结果蒸馏到 3D 占用 logits → 推理时直接输出，无需 VLM","results":"在现有占用世界模型上直接提升语义精度，特别是稀有类别和易混淆类别","importance":"3D 占用世界模型的语义错误直接影响自动驾驶碰撞检测和自由空间判断，VISA 提供了一种零推理开销的语义增强方案"}],"stats":{}},"2026-08-08":{"date":"2026-08-08","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV"],"papers":[],"stats":{}},"2026-08-07":{"date":"2026-08-07","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV"],"papers":[],"stats":{}},"2026-08-06":{"date":"2026-08-06","source":"arXiv","categories":["cs.CV","cs.CL","cs.LG"],"papers":[],"stats":{}},"2026-08-05":{"date":"2026-08-05","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV"],"papers":[{"id":"","title":"UniEvo-RS: Omni-Prompt Unified Remote Sensing Segmentation with Representative Exemplar-Driven Prototype Evolution","link":"","category":"🛰️_遥感","categoryLabel":"🛰️ 遥感 / 计算机视觉 / Foundation Models","summary":"","innovations":[],"method":"","results":"","importance":""},{"id":"","title":"ParVL: Parallel Scaling and Expandable Compute Allocation for Multimodal LLMs","link":"","category":"🛰️_遥感","categoryLabel":"🛰️ 遥感 / 计算机视觉 / Foundation Models","summary":"","innovations":[],"method":"","results":"","importance":""},{"id":"","title":"Latent Reward Registers for Diffusion Preference Alignment","link":"","category":"🛰️_遥感","categoryLabel":"🛰️ 遥感 / 计算机视觉 / Foundation Models","summary":"","innovations":[],"method":"","results":"","importance":""}],"stats":{}},"2026-08-04":{"date":"2026-08-04","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV","stat.ML"],"papers":[],"stats":{"totalScanned":60,"selected":12}},"2026-08-02":{"date":"2026-08-02","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV","cond-mat.str-el"],"papers":[],"stats":{}},"2026-07-31":{"date":"2026-07-31","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV"],"papers":[],"stats":{}},"2026-07-30":{"date":"2026-07-30","source":"arXiv","categories":["cs.AI","cs.LG","cs.CL","cs.CV"],"papers":[],"stats":{}}};
const AVAILABLE_DATES = ["2026-08-12","2026-08-10","2026-08-09","2026-08-08","2026-08-07","2026-08-06","2026-08-05","2026-08-04","2026-08-02","2026-07-31","2026-07-30"];

// Override fetch to use embedded data
const originalFetch = window.fetch;
window.fetch = async function(url, options) {
  if (typeof url === 'string') {
    // Handle API routes with embedded data
    if (url === '/api/papers/all') {
      return new Response(JSON.stringify({
        dates: AVAILABLE_DATES,
        latest: AVAILABLE_DATES[0],
        oldest: AVAILABLE_DATES[AVAILABLE_DATES.length - 1]
      }), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }
    
    if (url === '/api/papers/latest') {
      const latestDate = AVAILABLE_DATES[0];
      return new Response(JSON.stringify(PAPER_DATA[latestDate]), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }
    
    const dateMatch = url.match(/\/api\/papers\/(\d{4}-\d{2}-\d{2})/);
    if (dateMatch) {
      const date = dateMatch[1];
      if (PAPER_DATA[date]) {
        return new Response(JSON.stringify(PAPER_DATA[date]), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      } else {
        return new Response(JSON.stringify({ error: `No data for ${date}` }), {
          status: 404,
          headers: { 'Content-Type': 'application/json' }
        });
      }
    }
    
    const searchMatch = url.match(/\/api\/search\?q=(.+)/);
    if (searchMatch) {
      const query = decodeURIComponent(searchMatch[1]).toLowerCase();
      const results = [];
      
      for (const date of AVAILABLE_DATES) {
        const data = PAPER_DATA[date];
        if (!data) continue;
        
        for (const paper of data.papers) {
          const searchText = [
            paper.title,
            paper.summary,
            paper.method,
            paper.results,
            ...paper.innovations
          ].join(' ').toLowerCase();
          
          if (searchText.includes(query)) {
            results.push({ date, paper });
          }
        }
      }
      
      return new Response(JSON.stringify({
        query,
        count: results.length,
        results
      }), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }
  }
  
  // Fall back to original fetch for other requests
  return originalFetch.apply(this, arguments);
};

console.log('📊 Embedded data loaded:', AVAILABLE_DATES.length, 'dates');
